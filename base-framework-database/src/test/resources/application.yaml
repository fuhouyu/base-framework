spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:database_test
    username: username
    password: password
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      mode: always
      schema-locations: db/migrate/test.sql
      username: username
      password: password
mybatis:
  mapper-locations: classpath:mapper/*.xml
logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
    com.fuhouyu.framework.database.mapper: DEBUG
base:
  framework:
    database:
      transaction-expression: '*'