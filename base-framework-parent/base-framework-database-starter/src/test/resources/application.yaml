spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:database_test;DB_CLOSE_DELAY=-1
    username: username
    password: password
    type: com.alibaba.druid.pool.DruidDataSource
  sql:
    init:
      schema-locations: db/test.sql
jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.H2Dialect
  show-sql: true
  pretty-sql: true
  database-validation-mode: ERROR
logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
    com.fuhouyu.framework.database.mapper: DEBUG
