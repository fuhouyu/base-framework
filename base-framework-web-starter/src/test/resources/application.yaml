spring:
  application:
    name: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:kms_db;DB_CLOSE_DELAY=-1
    username: username
    password: password
    type: com.alibaba.druid.pool.DruidDataSource
base:
  framework:
    kms:
      key-provider: db
      key-ids:
        asymmetric: 70784B1AB6D54DA599FC5D90E48CF929
        symmetric: 90EC4F0D567D4A83879678E437DD581A
        digest: E72BCFAA4A114A16BE2F2A3F0D77B1D5
      db:
        data-init-path: classpath:db/key_db_data_h2.sql
    cache:
      service:
        cache-service-type: caffeine
    ip2region:
      enabled: true
      db-path: classpath:ip2region.xdb

